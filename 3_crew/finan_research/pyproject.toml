[project]
name = "finan_research"
version = "0.1.0"
description = "finan_research using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.1.0"
]

[project.scripts]
finan_research = "finan_research.main:run"
run_crew = "finan_research.main:run"
train = "finan_research.main:train"
replay = "finan_research.main:replay"
test = "finan_research.main:test"
run_with_trigger = "finan_research.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
